<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}DMN-BN{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f0efeb;font-family:Georgia,'Times New Roman',serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0efeb;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background-color:#ffffff;">

          <!-- Barre verte superieure -->
          <tr>
            <td style="background-color:#1B6B2E;height:5px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

          <!-- En-tete -->
          <tr>
            <td style="padding:40px 48px 28px;text-align:center;border-bottom:1px solid #ebebeb;">

              <!-- Logo CID -->
              <img src="cid:dmn_logo" alt="DMN-BN"
                   width="80" height="80"
                   style="display:block;margin:0 auto 20px;border-radius:4px;" />

              <!-- Texte arabe -->
              <p style="margin:0 0 6px;font-size:15px;color:#1B6B2E;direction:rtl;font-family:Arial,sans-serif;letter-spacing:0.5px;">
                &#1583;&#1575;&#1585; &#1605;&#1580;&#1605;&#1593; &#1575;&#1604;&#1606;&#1608;&#1585;&#1610;&#1606;
              </p>

              <!-- Nom latin -->
              <p style="margin:0 0 2px;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#888;font-family:Arial,sans-serif;">
                Daara Madjmahoun Noreyni &middot; UCAD
              </p>
              <p style="margin:0;font-size:17px;font-weight:700;color:#1a1a1a;letter-spacing:2px;font-family:Arial,sans-serif;">
                DMN&thinsp;&mdash;&thinsp;BN
              </p>
              <p style="margin:4px 0 0;font-size:9px;color:#aaa;letter-spacing:1.5px;font-family:Arial,sans-serif;text-transform:uppercase;">
                Biblioth&egrave;que Num&eacute;rique
              </p>
            </td>
          </tr>

          <!-- Corps -->
          <tr>
            <td style="padding:40px 48px 44px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Pied de page -->
          <tr>
            <td style="padding:20px 48px 28px;text-align:center;border-top:1px solid #ebebeb;">
              <p style="margin:0;font-size:10px;color:#bbb;font-family:Arial,sans-serif;line-height:1.8;letter-spacing:0.3px;">
                Commission P&eacute;dagogique &middot; Daara Madjmahoun Noreyni<br />
                Universit&eacute; Cheikh Anta Diop &middot; Dakar, S&eacute;n&eacute;gal<br />
                <br />
                Cet e-mail est envoy&eacute; automatiquement, merci de ne pas y r&eacute;pondre.
              </p>
            </td>
          </tr>

          <!-- Barre verte inferieure -->
          <tr>
            <td style="background-color:#1B6B2E;height:5px;font-size:0;line-height:0;">&nbsp;</td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
