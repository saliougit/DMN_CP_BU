<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block subject %}DMN-BN{% endblock %}</title>
<style>
  @media (max-width: 620px) {
    .container { width: 100% !important; }
    .pad { padding-left: 24px !important; padding-right: 24px !important; }
  }
  a.btn:hover { background: #2f5428 !important; }
</style>
</head>
<body style="margin:0; padding:0; background:#eceee9;">

<!-- Texte d'aperçu (visible dans la liste des mails) -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">
  {% block preheader %}{% endblock %}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eceee9;">
  <tr>
    <td align="center" style="padding:32px 12px;">

      <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; background:#ffffff; border-radius:6px; overflow:hidden;">

        <!-- En-tête -->
        <tr>
          <td class="pad" style="padding:28px 40px 22px 40px; border-bottom:1px solid #e3e6df;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td valign="middle" style="padding-right:14px;">
                  <img src="{{ logo_url }}" width="48" height="48" alt="DMN UCAD" style="display:block; border:0;">
                </td>
                <td valign="middle" style="font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
                  <div style="font-size:16px; font-weight:600; color:#1f2a1c;">Bibliothèque numérique</div>
                  <div style="font-size:13px; color:#6b7566; padding-top:2px;">Daara Madjmahoun Noreyni, UCAD</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Corps -->
        <tr>
          <td class="pad" style="padding:32px 40px 8px 40px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; color:#2b3328; font-size:15px; line-height:1.65;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- Pied de page -->
        <tr>
          <td class="pad" style="padding:20px 40px 24px 40px; background:#f7f8f5; border-top:1px solid #e3e6df; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#8a9385;">
            Daara Madjmahoun Noreyni, Université Cheikh Anta Diop de Dakar.<br>
            Ce message est envoyé automatiquement, merci de ne pas y répondre.
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
