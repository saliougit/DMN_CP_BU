# Sous-domaine public de MinIO (stockage objet - documents). Nécessaire
# pour que les URLs renvoyées par django-storages (S3Boto3Storage) soient
# joignables depuis un navigateur - le nom interne Docker "storage" n'est
# résolvable que dans le réseau Docker. Voir MINIO_PUBLIC_ENDPOINT dans
# backend/dmn_bu/settings/production.py.
server {
    listen 80;
    listen [::]:80;

    server_name storage-bnumerique.dmnucad.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
