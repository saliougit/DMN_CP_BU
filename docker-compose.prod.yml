services:
  db:
    image: postgres:16-alpine
    container_name: dmnbu_db
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dmnbu_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dmnbu_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - dmnbu_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  search:
    image: getmeili/meilisearch:v1.9
    container_name: dmnbu_search
    restart: unless-stopped
    env_file:
      - ./.env.production
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - dmnbu_network

  # Stockage objet des documents (django-storages / S3Boto3Storage). Le
  # backend s'y connecte en interne via le nom de service Docker (rapide,
  # http) ; les URLs publiques renvoyées au frontend pointent vers
  # storage-bnumerique.dmnucad.com (nginx sur l'hôte, HTTPS) - voir
  # MINIO_ENDPOINT / MINIO_PUBLIC_ENDPOINT dans backend/dmn_bu/settings/production.py.
  # minio/minio sur Docker Hub refuse le pull depuis fin 2025 (MinIO pousse
  # vers son offre commerciale "AIStor") - ghcr.io/coollabsio/minio est un
  # mirror communautaire actif (projet Coolify) qui recompile les sources
  # officielles MinIO à chaque release. Même contournement que DMN-PGI.
  storage:
    image: ghcr.io/coollabsio/minio:latest
    container_name: dmnbu_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./.env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9010:9000"
    networks:
      - dmnbu_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Crée le bucket (et sa policy publique en lecture) au premier démarrage -
  # MinIO ne le fait pas automatiquement.
  storage-init:
    image: minio/mc:latest
    container_name: dmnbu_storage_init
    depends_on:
      storage:
        condition: service_healthy
    env_file:
      - ./.env.production
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://storage:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
        mc mb --ignore-existing local/$$MINIO_BUCKET;
        mc anonymous set download local/$$MINIO_BUCKET;
        echo 'Bucket MinIO initialisé.';
      "
    networks:
      - dmnbu_network
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: dmnbu_backend
    restart: unless-stopped
    env_file:
      - ./.env.production
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend/staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - dmnbu_network

  celery:
    build:
      context: ./backend
    container_name: dmnbu_celery
    restart: unless-stopped
    entrypoint: []
    command: ["celery", "-A", "dmn_bu", "worker", "--loglevel=info", "-c", "4", "-Q", "default"]
    env_file:
      - ./.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - dmnbu_network

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: dmnbu_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      backend:
        condition: service_started
    networks:
      - dmnbu_network

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
  minio_data:

networks:
  dmnbu_network:
    driver: bridge
