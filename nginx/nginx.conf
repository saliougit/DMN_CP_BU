events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    client_max_body_size 50M;

    # DNS interne Docker — force la re-résolution dynamique des hostnames.
    # Sans cela, Nginx cache l'IP au démarrage et perd la route si un container
    # est recréé (IP change). TTL 10s = re-résolution toutes les 10 secondes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── HTTP ────────────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Validation Certbot (Let's Encrypt HTTP-01 challenge)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # En production avec SSL : décommenter la ligne suivante
        # return 301 https://$host$request_uri;

        # API Django
        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Admin Django
        location /admin/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host      $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fichiers statiques Django (collectstatic)
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend Next.js
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }

    # ── HTTPS (décommenter après obtention du certificat Certbot) ───────────────
    # Remplacer "votre-domaine.com" par le vrai domaine.
